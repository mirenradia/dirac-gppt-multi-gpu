<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="100%" style="display:block; margin:0 auto;">
  <style>
    .box { stroke: #333; stroke-width: 1.5; rx: 4; }
    .mem { fill: #a8d8ea; }
    .cpu { fill: #aa96da; }
    .gpu { fill: #fcbad3; }
    .nic { fill: #ffffd2; }
    .int { fill: #d4f0f0; }
    .label { font-family: sans-serif; font-size: 14px; fill: #222; text-anchor: middle; dominant-baseline: central; }
    .title { font-family: sans-serif; font-size: 15px; fill: #222; text-anchor: middle; font-weight: bold; }
    .ellipsis { font-size: 32px; }
    .link { stroke: #444; stroke-width: 1.5; fill: none; }
    .cpu-link, .gpu-link { stroke: #444; stroke-width: 6; fill: none; }
    .rail { stroke: #666; stroke-width: 2; fill: none; }
    .tap { stroke: #666; stroke-width: 2; fill: none; }
    .dot { fill: #444; }
  </style>

  <defs>
    <g id="node">
      <rect x="70" y="4" width="110" height="44" class="box mem"/>
      <text x="125" y="19" class="label">Main</text>
      <text x="125" y="33" class="label">memory</text>
      <rect x="200" y="4" width="110" height="44" class="box mem"/>
      <text x="255" y="19" class="label">Main</text>
      <text x="255" y="33" class="label">memory</text>

      <rect x="70" y="58" width="110" height="50" class="box cpu"/>
      <text x="125" y="83" class="label">CPU 1</text>
      <rect x="200" y="58" width="110" height="50" class="box cpu"/>
      <text x="255" y="83" class="label">CPU 2</text>

      <line x1="125" y1="48" x2="125" y2="58" class="link"/>
      <line x1="255" y1="48" x2="255" y2="58" class="link"/>
      <line x1="180" y1="83" x2="200" y2="83" class="cpu-link"/>

      <line x1="138" y1="163" x2="242" y2="213" class="gpu-link"/>
      <line x1="242" y1="163" x2="138" y2="213" class="gpu-link"/>

      <rect x="70" y="121" width="74" height="48" class="box gpu"/>
      <text x="107" y="145" class="label">GPU 1</text>
      <rect x="236" y="121" width="74" height="48" class="box gpu"/>
      <text x="273" y="145" class="label">GPU 2</text>
      <rect x="70" y="207" width="74" height="48" class="box gpu"/>
      <text x="107" y="231" class="label">GPU 3</text>
      <rect x="236" y="207" width="74" height="48" class="box gpu"/>
      <text x="273" y="231" class="label">GPU 4</text>

      <line x1="144" y1="145" x2="236" y2="145" class="gpu-link"/>
      <line x1="144" y1="231" x2="236" y2="231" class="gpu-link"/>
      <line x1="107" y1="169" x2="107" y2="207" class="gpu-link"/>
      <line x1="273" y1="169" x2="273" y2="207" class="gpu-link"/>

      <line x1="55" y1="83" x2="55" y2="304" class="rail"/>
      <line x1="55" y1="83" x2="70" y2="83" class="tap"/>
      <line x1="55" y1="145" x2="70" y2="145" class="tap"/>
      <line x1="55" y1="231" x2="70" y2="231" class="tap"/>
      <line x1="55" y1="304" x2="70" y2="304" class="tap"/>

      <line x1="325" y1="83" x2="325" y2="304" class="rail"/>
      <line x1="325" y1="83" x2="310" y2="83" class="tap"/>
      <line x1="325" y1="145" x2="310" y2="145" class="tap"/>
      <line x1="325" y1="231" x2="310" y2="231" class="tap"/>
      <line x1="325" y1="304" x2="310" y2="304" class="tap"/>

      <rect x="70" y="280" width="74" height="48" class="box nic"/>
      <text x="107" y="304" class="label">NIC 1</text>
      <rect x="236" y="280" width="74" height="48" class="box nic"/>
      <text x="273" y="304" class="label">NIC 2</text>

      <circle cx="55" cy="83" r="3" class="dot"/>
      <circle cx="55" cy="145" r="3" class="dot"/>
      <circle cx="55" cy="231" r="3" class="dot"/>
      <circle cx="55" cy="304" r="3" class="dot"/>
      <circle cx="325" cy="83" r="3" class="dot"/>
      <circle cx="325" cy="145" r="3" class="dot"/>
      <circle cx="325" cy="231" r="3" class="dot"/>
      <circle cx="325" cy="304" r="3" class="dot"/>
    </g>
  </defs>

  <g transform="translate(40, 20)"><use href="#node"/></g>
  <g transform="translate(420, 20)"><use href="#node"/></g>
  <g transform="translate(800, 20)"><use href="#node"/></g>

  <text x="1210" y="190" class="title ellipsis"> ( ... )</text>
  <text x="230" y="12" class="title" font-size="13">Node 1</text>
  <text x="610" y="12" class="title" font-size="13">Node 2</text>
  <text x="990" y="12" class="title" font-size="13">Node 3</text>

  <rect x="50" y="360" width="1240" height="40" class="box int" rx="6"/>
  <text x="670" y="380" class="label" font-size="14" font-weight="bold">Interconnect</text>

  <line x1="147" y1="348" x2="147" y2="360" class="link"/>
  <line x1="313" y1="348" x2="313" y2="360" class="link"/>
  <line x1="527" y1="348" x2="527" y2="360" class="link"/>
  <line x1="693" y1="348" x2="693" y2="360" class="link"/>
  <line x1="907" y1="348" x2="907" y2="360" class="link"/>
  <line x1="1073" y1="348" x2="1073" y2="360" class="link"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Full 2D domain</title>
  <desc id="desc">A single undecomposed square grid representing the full Jacobi domain.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#4f8f3d" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="24" y="24" width="384" height="384" fill="#74b54b"/>
  <rect x="24" y="24" width="384" height="384" fill="url(#grid)"/>
</svg>

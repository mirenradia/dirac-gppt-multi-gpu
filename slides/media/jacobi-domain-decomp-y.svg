<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 624" width="460" height="624" role="img" aria-labelledby="title desc">
  <title id="title">Domain decomposition in y-direction</title>
  <desc id="desc">The 2D domain split into horizontal slabs with distinct halo rows and arrows showing neighbour communication.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#4f8f3d" stroke-width="2"/>
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" markerWidth="4" markerHeight="4" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f8f8f"/>
    </marker>
  </defs>

  <g>
    <rect x="48" y="24" width="384" height="120" fill="#74b54b"/>
    <rect x="48" y="120" width="384" height="24" fill="#b7d99f"/>
    <rect x="48" y="24" width="384" height="120" fill="url(#grid)"/>
    <rect x="48" y="24" width="384" height="120" fill="none" stroke="#4f8f3d" stroke-width="2"/>
  </g>

  <g>
    <rect x="48" y="168" width="384" height="144" fill="#74b54b"/>
    <rect x="48" y="168" width="384" height="24" fill="#b7d99f"/>
    <rect x="48" y="288" width="384" height="24" fill="#b7d99f"/>
    <rect x="48" y="168" width="384" height="144" fill="url(#grid)"/>
    <rect x="48" y="168" width="384" height="144" fill="none" stroke="#4f8f3d" stroke-width="2"/>
  </g>

  <g>
    <rect x="48" y="336" width="384" height="144" fill="#74b54b"/>
    <rect x="48" y="336" width="384" height="24" fill="#b7d99f"/>
    <rect x="48" y="456" width="384" height="24" fill="#b7d99f"/>
    <rect x="48" y="336" width="384" height="144" fill="url(#grid)"/>
    <rect x="48" y="336" width="384" height="144" fill="none" stroke="#4f8f3d" stroke-width="2"/>
  </g>

  <g>
    <rect x="48" y="504" width="384" height="120" fill="#74b54b"/>
    <rect x="48" y="504" width="384" height="24" fill="#b7d99f"/>
    <rect x="48" y="504" width="384" height="120" fill="url(#grid)"/>
    <rect x="48" y="504" width="384" height="120" fill="none" stroke="#4f8f3d" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#8f8f8f" stroke-width="2.25" marker-end="url(#arrow)">
    <path d="M 48 132 C 24 132, 24 180, 42 180"/>
    <path d="M 432 180 C 456 180, 456 132, 438 132"/>

    <path d="M 48 300 C 24 300, 24 348, 42 348"/>
    <path d="M 432 348 C 456 348, 456 300, 438 300"/>

    <path d="M 48 468 C 24 468, 24 516, 42 516"/>
    <path d="M 432 516 C 456 516, 456 468, 438 468"/>
  </g>
</svg>
